name: ClipFactory verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-rus
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - shell: bash
        run: |
          for f in static/*.js; do node --check "$f" || exit 1; done
      - run: python -m unittest discover -v
