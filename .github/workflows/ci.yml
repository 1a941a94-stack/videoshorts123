name: ClipFactory verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-rus
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
            curl.exe --fail --location --retry 5 --retry-all-errors --output $zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed' }
            Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
            $bin = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1).Directory.FullName
            if (-not $bin -or -not (Test-Path "$bin/ffprobe.exe")) { throw 'FFmpeg tools missing' }
            Add-Content -Path $env:GITHUB_PATH -Value $bin
          }
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - shell: bash
        run: |
          for f in static/*.js; do node --check "$f" || exit 1; done
      - run: python -m unittest discover -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest pytest-playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest browser_tests -v --tracing retain-on-failure --screenshot only-on-failure --output browser-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: browser-results
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff bandit
      - run: ruff check . --select E9,F63,F7,F82 --output-format github
      - run: npm exec --yes --package=eslint@9 -- eslint "static/*.js"
      - run: bandit -r . -x ./browser_tests -ll -ii -f json -o bandit-report.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-analysis
          path: bandit-report.json
          if-no-files-found: ignore
