name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: python -m pip install -r requirements-captions.txt -r requirements-telegram.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -v
