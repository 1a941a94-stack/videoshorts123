services:
  factory:
    build:
      context: .
      dockerfile: Dockerfile.business
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      CLIP_DATA_ROOT: /data
      CLIP_BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
